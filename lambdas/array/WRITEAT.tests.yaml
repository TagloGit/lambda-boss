tests:
  - name: overwrite first element of column array (edge)
    args: ['={"a";"b";"c";"d";"e";"f"}', "X", "=1"]
    expected: [["X"], ["b"], ["c"], ["d"], ["e"], ["f"]]

  - name: overwrite last element of column array (edge)
    args: ['={"a";"b";"c";"d";"e";"f"}', "X", "=6"]
    expected: [["a"], ["b"], ["c"], ["d"], ["e"], ["X"]]

  - name: overwrite middle element of column array
    args: ['={"a";"b";"c";"d"}', "X", "=3"]
    expected: [["a"], ["b"], ["X"], ["d"]]

  - name: overwrite element of row array (auto-detected horizontal)
    args: ['={"a","b","c","d","e"}', "X", "=3"]
    expected: [["a", "b", "X", "d", "e"]]

  - name: overwrite with a numeric value
    args: ['={1,2,3,4,5}', "=99", "=2"]
    expected: [[1, 99, 3, 4, 5]]

  - name: single-element column array
    args: ['={"a"}', "X", "=1"]
    expected: "X"

  - name: position past the end fails loud (NA)
    args: ['={"a";"b";"c"}', "X", "=4"]
    expected: -2146826246

  - name: position below 1 fails loud (NA)
    args: ['={"a";"b";"c"}', "X", "=0"]
    expected: -2146826246

  - name: overwrite via real column range using setup
    setup:
      cells:
        - address: "B2:B5"
          values:
            - ["a"]
            - ["b"]
            - ["c"]
            - ["d"]
      names:
        - { name: "wcol", refers_to: "B2:B5" }
    args: ["=wcol", "X", "=2"]
    expected: [["a"], ["X"], ["c"], ["d"]]

  - name: overwrite via real horizontal range using setup
    setup:
      cells:
        - address: "B2:E2"
          values:
            - ["a", "b", "c", "d"]
      names:
        - { name: "wrow", refers_to: "B2:E2" }
    args: ["=wrow", "X", "=3"]
    expected: [["a", "b", "X", "d"]]

  - name: help text
    args: []
    expected_type: array
