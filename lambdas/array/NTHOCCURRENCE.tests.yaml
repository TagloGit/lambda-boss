tests:
  - name: column of text with repeats
    args: ['={"A";"S";"S";"A";"M";"A"}']
    expected: [[1], [1], [2], [2], [1], [3]]

  - name: row of numbers with repeats
    args: ["={10,20,10,10,20}"]
    expected: [[1, 1, 2, 3, 2]]

  - name: all same value column
    args: ["={5;5;5}"]
    expected: [[1], [2], [3]]

  - name: all unique values column
    args: ["={1;2;3;4}"]
    expected: [[1], [1], [1], [1]]

  - name: matches like = (case-insensitive, text and numbers distinct, no wildcards)
    args: ['={"a";"A";1;"1";TRUE;1;"";0;"a*";"ab";"A";FALSE;0}']
    expected: [[1], [2], [1], [1], [1], [2], [1], [1], [1], [1], [3], [1], [2]]

  - name: float arithmetic matches as = does (0.1+0.2 = 0.3)
    args: ['=VSTACK(0.1+0.2,0.3,0.3)']
    expected: [[1], [2], [3]]

  - name: an error stays in its own row
    args: ['=IF({1;0;1;1;0},{1;1;1;2;1},NA())']
    expected: [[1], [-2146826246], [2], [1], [-2146826246]]

  - name: worksheet range with blanks
    setup:
      cells:
        - address: "D1"
          values: [["a"]]
        - address: "D3"
          values: [[1]]
        - address: "D5:D6"
          values:
            - ["A"]
            - [1]
      names:
        - { name: "nthRng", refers_to: "D1:D6" }
    args: ["=nthRng"]
    expected: [[1], [1], [1], [2], [2], [2]]

  - name: help text
    args: []
    expected_type: array
