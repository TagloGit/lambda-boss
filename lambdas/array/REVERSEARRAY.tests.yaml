tests:
  - name: reverse vertical numeric array (default both)
    args: ["={1;2;3;4;5}"]
    expected: [[5], [4], [3], [2], [1]]

  - name: reverse horizontal string array (default both)
    args: ['={"A","B","C"}']
    expected: [["C", "B", "A"]]

  - name: reverse single element
    args: ["={42}"]
    expected: 42

  - name: reverse two elements vertical
    args: ["={10;20}"]
    expected: [[20], [10]]

  - name: 2D default (both axes)
    args: ["={1,2;3,4}"]
    expected: [[4, 3], [2, 1]]

  - name: 2D axis=1 horizontal flip (reverse columns)
    args: ["={1,2;3,4}", "=1"]
    expected: [[2, 1], [4, 3]]

  - name: 2D axis=2 vertical flip (reverse rows)
    args: ["={1,2;3,4}", "=2"]
    expected: [[3, 4], [1, 2]]

  - name: 2D 3x3 default both axes (180 rotation)
    args: ["={1,2,3;4,5,6;7,8,9}"]
    expected: [[9, 8, 7], [6, 5, 4], [3, 2, 1]]

  - name: 2D 3x3 axis=1 horizontal flip
    args: ["={1,2,3;4,5,6;7,8,9}", "=1"]
    expected: [[3, 2, 1], [6, 5, 4], [9, 8, 7]]

  - name: 2D 3x3 axis=2 vertical flip
    args: ["={1,2,3;4,5,6;7,8,9}", "=2"]
    expected: [[7, 8, 9], [4, 5, 6], [1, 2, 3]]

  - name: 1D vertical with explicit axis=2
    args: ["={1;2;3;4;5}", "=2"]
    expected: [[5], [4], [3], [2], [1]]

  - name: 1D horizontal with explicit axis=1
    args: ['={"A","B","C"}', "=1"]
    expected: [["C", "B", "A"]]

  - name: help text
    args: []
    expected_type: array
