tests:
  - name: double each column value
    args: ["={1,2,3;4,5,6}", "=LAMBDA(c, c*2)"]
    expected: [[2, 4, 6], [8, 10, 12]]

  - name: single column array
    args: ["={1;2;3}", "=LAMBDA(c, c+10)"]
    expected: [[11], [12], [13]]

  - name: single cell array
    args: ["={5}", "=LAMBDA(c, c*3)"]
    expected: 15

  - name: single row multi column
    args: ["={10,20,30}", "=LAMBDA(c, c/10)"]
    expected: [[1, 2, 3]]

  # An error from one column stays in that column (2026-11-23). Before, a column whose function
  # returned a bare error (not an array) made HSTACK return that error for the whole result.
  - name: 1/c with a zero in the middle column
    args: ["={1,2,0,4,5}", "=LAMBDA(c, 1/c)"]
    expected: [[1, 0.5, -2146826281, 0.25, 0.2]]

  - name: error in the first column
    args: ["={0,2,4}", "=LAMBDA(c, 1/c)"]
    expected: [[-2146826281, 0.5, 0.25]]

  - name: error in the last column
    args: ["={1,2,0}", "=LAMBDA(c, 1/c)"]
    expected: [[1, 0.5, -2146826281]]

  - name: empty FILTER gives CALC in its own column only
    args: ["={1,3,5;2,4,6}", "=LAMBDA(c, SUM(FILTER(c, c > 3)))"]
    expected: [[-2146826238, 4, 11]]

  - name: text column gives VALUE in its own column only
    args: ['={1,"a",3}', "=LAMBDA(c, c + 0)"]
    expected: [[1, -2146826273, 3]]

  - name: single cell error is the result
    args: ["={0}", "=LAMBDA(c, 1/c)"]
    expected: -2146826281
