tests:
  - name: double each row value
    args: ["={1,2,3;4,5,6}", "=LAMBDA(r, r*2)"]
    expected: [[2, 4, 6], [8, 10, 12]]

  - name: single row array
    args: ["={1,2,3}", "=LAMBDA(r, r+10)"]
    expected: [[11, 12, 13]]

  - name: single cell array
    args: ["={5}", "=LAMBDA(r, r*3)"]
    expected: 15

  - name: single column multi row
    args: ["={10;20;30}", "=LAMBDA(r, r/10)"]
    expected: [[1], [2], [3]]

  # An error from one row stays in that row, as BYROW keeps it (2026-11-23). Before, a row whose
  # function returned a bare error (not an array) made VSTACK return that error for the whole result.
  - name: 1/r with a zero in the middle row
    args: ["={1;2;0;4;5}", "=LAMBDA(r, 1/r)"]
    expected: [[1], [0.5], [-2146826281], [0.25], [0.2]]

  - name: error in the first row
    args: ["={0;2;4;5}", "=LAMBDA(r, 1/r)"]
    expected: [[-2146826281], [0.5], [0.25], [0.2]]

  - name: error in the last row
    args: ["={1;2;4;0}", "=LAMBDA(r, 1/r)"]
    expected: [[1], [0.5], [0.25], [-2146826281]]

  - name: odd row count with an error in the first row
    args: ["={0;1;2;4;5;8;10}", "=LAMBDA(r, 1/r)"]
    expected: [[-2146826281], [1], [0.5], [0.25], [0.2], [0.125], [0.1]]

  - name: a row returning NA() keeps the other rows
    args: ["={1,2;3,1;5,6}", "=LAMBDA(r, IF(INDEX(r, 1) = 3, NA(), r))"]
    expected: [[1, 2], [-2146826246, -2146826246], [5, 6]]

  - name: scalar error from a multi-column row
    args: ["={1,2;0,3;4,5}", "=LAMBDA(r, 1/INDEX(r, 1))"]
    expected: [[1], [-2146826281], [0.25]]

  - name: empty FILTER gives CALC in its own row only
    args: ["={1,2;3,4;5,6}", "=LAMBDA(r, SUM(FILTER(r, r > 3)))"]
    expected: [[-2146826238], [4], [11]]

  - name: text row gives VALUE in its own row only
    args: ['={1;"a";3}', "=LAMBDA(r, r + 0)"]
    expected: [[1], [-2146826273], [3]]

  - name: error inside a row array was already kept
    args: ["={1,2;0,4}", "=LAMBDA(r, 1/r)"]
    expected: [[1, 0.5], [-2146826281, 0.25]]

  - name: single cell error is the result
    args: ["={0}", "=LAMBDA(r, 1/r)"]
    expected: -2146826281

  - name: single row returning NA() is the result
    args: ["={1,2}", "=LAMBDA(r, NA())"]
    expected: -2146826246

  - name: mixed 1x1 and 1xn results pad with NA
    args: ["={1,2;3,4;5,6}", "=LAMBDA(r, IF(SUM(r) > 5, r, SUM(r)))"]
    expected: [[3, -2146826246], [3, 4], [5, 6]]

  - name: range argument, function returns a range reference
    setup:
      cells:
        - address: G2:I5
          values: [[1, 2, 3], [4, 5, 6], [7, 0, 9], [10, 11, "=1/0"]]
    args: ["=G2:I5", "=LAMBDA(r, TAKE(r, , 2))"]
    expected: [[1, 2], [4, 5], [7, 0], [10, 11]]

  - name: range argument, INDEX reference to an error cell
    setup:
      cells:
        - address: G2:I5
          values: [[1, 2, 3], [4, 5, 6], [7, 0, 9], [10, 11, "=1/0"]]
    args: ["=G2:I5", "=LAMBDA(r, INDEX(r, 1, 3))"]
    expected: [[3], [6], [9], [-2146826281]]

  - name: single column range with a zero
    setup:
      cells:
        - address: G2:G5
          values: [[1], [2], [0], [4]]
    args: ["=G2:G5", "=LAMBDA(r, 1/r)"]
    expected: [[1], [0.5], [-2146826281], [0.25]]
