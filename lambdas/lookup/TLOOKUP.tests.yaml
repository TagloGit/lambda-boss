  - name: row mode with header-less table drops key column
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblData", refers_to: "C4:E6" }
