tests:
  - name: lookup numeric value by row key and header
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Tim", "=tblPerson", "Age"]
    expected: 42

  - name: lookup string value by row key and header
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Sam", "=tblPerson", "City"]
    expected: "Melbourne"

  - name: lookup last-row entry
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Alex", "=tblPerson", "Age"]
    expected: 25

  - name: item not found returns NA by default
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Jordan", "=tblPerson", "Age"]
    expected: -2146826246

  - name: item not found with custom fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Jordan", "=tblPerson", "Age", "missing"]
    expected: "missing"

  - name: header not found returns NA by default
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Tim", "=tblPerson", "Salary"]
    expected: -2146826246

  - name: header not found with custom numeric fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Tim", "=tblPerson", "Salary", "=0"]
    expected: 0

  - name: vertical array of items lifts
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", '={"Tim";"Sam";"Alex"}', "=tblPerson", "Age"]
    expected: [[42], [30], [25]]

  - name: array of items with one missing uses fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", '={"Tim";"Jordan";"Alex"}', "=tblPerson", "Age", "=-1"]
    expected: [[42], [-1], [25]]

  - name: omitted LookupCol defaults to first table column
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "Tim", "=", "Age"]
    expected: 42

  - name: omitted LookupCol with array of items lifts
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", '={"Tim";"Alex"}', "=", "Age"]
    expected: [[42], [25]]

  - name: omitted Item returns whole numeric column under header
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Age"]
    expected: [[42], [30], [25]]

  - name: omitted Item returns whole string column under header
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "City"]
    expected: [["Sydney"], ["Melbourne"], ["Perth"]]

  - name: whole column mode with header not found returns NA by default
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Salary"]
    expected: -2146826246

  - name: whole column mode with header not found uses fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Salary", "none"]
    expected: "none"

  - name: row mode with headered table drops key column
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "Tim"]
    expected: [[42, "Sydney"]]

  - name: row mode with header-less table drops key column
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblData", refers_to: "C4:E6" }
    args: ["=tblData", "Sam"]
    expected: [[30, "Melbourne"]]

  - name: row mode with explicit LookupCol returns whole row (headered table)
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblAll", "Sam", "=tblPerson"]
    expected: [["Sam", 30, "Melbourne"]]

  - name: row mode with explicit LookupCol returns whole row (header-less table)
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblData", refers_to: "C4:E6" }
        - { name: "tblPerson", refers_to: "C4:C6" }
    args: ["=tblData", "Alex", "=tblPerson"]
    expected: [["Alex", 25, "Perth"]]

  - name: row mode with array of items stacks rows
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", '={"Tim";"Alex"}']
    expected: [[42, "Sydney"], [25, "Perth"]]

  - name: row mode item not found returns NA by default
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "Jordan"]
    expected: -2146826246

  - name: row mode array with missing item fills its row with fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", '={"Tim";"Jordan"}', "=", "=", "missing"]
    expected: [[42, "Sydney"], ["missing", "missing"]]

  - name: help text
    args: []
    expected_type: array
