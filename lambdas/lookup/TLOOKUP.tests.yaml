            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Age"]
    expected: [[42], [30], [25]]

  - name: omitted Item returns whole string column under header
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
