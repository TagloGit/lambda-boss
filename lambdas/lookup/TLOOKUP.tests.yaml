      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Salary"]
    expected: -2146826246

  - name: whole column mode with header not found uses fallback
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "=", "=", "Salary", "none"]
    expected: "none"

  - name: row mode with headered table drops key column
    setup:
      cells:
        - address: "C3:E6"
          values:
            - ["Person", "Age", "City"]
            - ["Tim", 42, "Sydney"]
            - ["Sam", 30, "Melbourne"]
            - ["Alex", 25, "Perth"]
      names:
        - { name: "tblAll", refers_to: "C3:E6" }
    args: ["=tblAll", "Tim"]
