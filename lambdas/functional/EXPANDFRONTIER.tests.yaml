# Test graph (edge list source -> target): A->B, A->C, C->D, B->A, E->A
# getNext = FILTER(targets, sources = node, "")
tests:
  - name: single seed reaches full closure
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))']
    expected: [["A"], ["B"], ["C"], ["D"]]

  - name: include_seeds FALSE returns only newly-reached nodes
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=FALSE"]
    expected: [["B"], ["C"], ["D"]]

  - name: array of seeds merges closures
    args: ['={"E";"D"}', '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))']
    expected: [["E"], ["D"], ["A"], ["B"], ["C"]]

  - name: isolated seed with no neighbours returns just the seed
    args: ["Z", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))']
    expected: "Z"

  - name: getNext errors and empty strings are absorbed as no neighbours
    args: ["A", '=LAMBDA(node, IF(node="A", {"B";""}, NA()))']
    expected: [["A"], ["B"]]

  - name: numeric node IDs
    args: ["=1", "=LAMBDA(node, FILTER({2;3;4}, {1;2;3}=node, \"\"))"]
    expected: [[1], [2], [3], [4]]

  - name: max_depth exceeded returns NA
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=1"]
    expected: -2146826246

  - name: max_hops 1 returns the seeds and their direct neighbours
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=", "=1"]
    expected: [["A"], ["B"], ["C"]]

  - name: max_hops 0 returns the seeds only
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=", "=0"]
    expected: "A"

  - name: max_hops beyond the closure returns the full closure
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=", "=9"]
    expected: [["A"], ["B"], ["C"], ["D"]]

  - name: max_hops within max_depth does not trip the guard
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=1", "=1"]
    expected: [["A"], ["B"], ["C"]]

  - name: max_hops with include_seeds FALSE
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=FALSE", "=", "=1"]
    expected: [["B"], ["C"]]

  - name: with_hops TRUE adds each node's hop count
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=", "=", "=TRUE"]
    expected: [["A", 0], ["B", 1], ["C", 1], ["D", 2]]

  - name: with_hops TRUE with include_seeds FALSE and several seeds
    args: ['={"E";"D"}', '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=FALSE", "=", "=", "=TRUE"]
    expected: [["A", 1], ["B", 2], ["C", 2]]

  - name: with_hops FALSE is the plain column
    args: ["A", '=LAMBDA(node, FILTER({"B";"C";"D";"A";"A"}, {"A";"A";"C";"B";"E"}=node, ""))', "=", "=", "=", "=FALSE"]
    expected: [["A"], ["B"], ["C"], ["D"]]

