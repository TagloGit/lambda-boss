tests:
  - name: default start forward wrap
    args: ["=35", "=19"]
    expected: 17

  - name: explicit start forward wrap
    args: ["=12", "=19", "=5"]
    expected: 17

  - name: backward move wraps from default start
    args: ["=-2", "=19"]
    expected: 18

  - name: zero-based indexing default start
    args: ["=35", "=19", "=0", "=TRUE"]
    expected: 16

  - name: zero moves returns start
    args: ["=0", "=19", "=7"]
    expected: 7

  - name: full loop returns start
    args: ["=19", "=19", "=3"]
    expected: 3

  - name: vertical array of moves lifts (MOD naturally lifts)
    args: ['={1;5;-2}', "=19"]
    expected: [[2], [6], [18]]

  - name: vertical array of starts lifts
    args: ["=0", "=19", '={1;5;19}']
    expected: [[1], [5], [19]]

  - name: help text
    args: []
    expected_type: array
