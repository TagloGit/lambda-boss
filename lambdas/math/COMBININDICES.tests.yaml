tests:
  - name: 5 choose 3 produces lexicographic 10x3 matrix
    args: ["=5", "=3"]
    expected:
      - [1, 2, 3]
      - [1, 2, 4]
      - [1, 2, 5]
      - [1, 3, 4]
      - [1, 3, 5]
      - [1, 4, 5]
      - [2, 3, 4]
      - [2, 3, 5]
      - [2, 4, 5]
      - [3, 4, 5]

  - name: 4 choose 2 produces 6x2 matrix
    args: ["=4", "=2"]
    expected:
      - [1, 2]
      - [1, 3]
      - [1, 4]
      - [2, 3]
      - [2, 4]
      - [3, 4]

  - name: k=1 returns column of indices
    args: ["=3", "=1"]
    expected:
      - [1]
      - [2]
      - [3]

  - name: k=n returns single row of all indices
    args: ["=4", "=4"]
    expected:
      - [1, 2, 3, 4]

  - name: n=2 k=2 returns single pair
    args: ["=2", "=2"]
    expected:
      - [1, 2]

  - name: n=1 k=1 returns scalar 1
    args: ["=1", "=1"]
    expected: 1

  - name: k greater than n returns NA
    args: ["=3", "=5"]
    expected: -2146826246

  - name: k=0 returns NA
    args: ["=5", "=0"]
    expected: -2146826246

  - name: non-integer k returns NA
    args: ["=5", "=2.5"]
    expected: -2146826246

  - name: repetition FALSE matches default behaviour
    args: ["=4", "=2", "=FALSE"]
    expected:
      - [1, 2]
      - [1, 3]
      - [1, 4]
      - [2, 3]
      - [2, 4]
      - [3, 4]

  - name: repetition n=3 k=2 gives non-decreasing multisets
    args: ["=3", "=2", "=TRUE"]
    expected:
      - [1, 1]
      - [1, 2]
      - [1, 3]
      - [2, 2]
      - [2, 3]
      - [3, 3]

  - name: repetition allows k greater than n
    args: ["=2", "=3", "=TRUE"]
    expected:
      - [1, 1, 1]
      - [1, 1, 2]
      - [1, 2, 2]
      - [2, 2, 2]

  - name: help text
    args: []
    expected_type: array
