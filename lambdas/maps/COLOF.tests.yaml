tests:
  - name: simple position Q17
    args: ["=17000017"]
    expected: 17

  - name: column 5 from position E5
    args: ["=5000005"]
    expected: 5

  - name: top-left A1
    args: ["=1000001"]
    expected: 1

  - name: multi-letter column AB
    args: ['=TOPOS("AB12")']
    expected: 28

  - name: composed with TOPOS XFD
    args: ['=TOPOS("XFD16384")']
    expected: 16384

  - name: custom mult 50
    args: ["=526", "=50"]
    expected: 26

  - name: custom mult matches TOPOS custom mult
    args: ['=TOPOS("Z10", 50)', "=50"]
    expected: 26

  - name: vertical array of positions lifts
    args: ['={1000001;5000005;17000017}']
    expected: [[1], [5], [17]]

  - name: horizontal array of positions lifts
    args: ['={1000001,5000005,17000017}']
    expected: [[1, 5, 17]]

  - name: help text
    args: []
    expected_type: array

  - name: packed row above 1048576 (#380)
    args: ["=2000000000001"]
    expected: 1

  - name: column past XFD (#380)
    args: ['=TOPOS("ABCD9")']
    expected: 19010
