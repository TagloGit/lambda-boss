tests:
  - name: E5
    args: ["=5", "=5"]
    expected: "E5"

  - name: A1 top-left
    args: ["=1", "=1"]
    expected: "A1"

  - name: max column XFD
    args: ["=16384", "=16384"]
    expected: "XFD16384"

  - name: multi-letter column AA
    args: ["=10", "=27"]
    expected: "AA10"

  - name: inverse of ROWNUM/COLNUM
    args: ['=ROWNUM("E5")', '=COLNUM("E5")']
    expected: "E5"

  - name: vertical array of rows lifts
    args: ['={1;5;17}', "=2"]
    expected: [["B1"], ["B5"], ["B17"]]

  - name: horizontal array of cols lifts
    args: ["=3", '={1,2,3}']
    expected: [["A3", "B3", "C3"]]

  - name: row column-vector broadcasts against col row-vector into a grid
    args: ['={1;2}', '={1,2,3}']
    expected: [["A1", "B1", "C1"], ["A2", "B2", "C2"]]

  - name: help text
    args: []
    expected_type: array

  - name: Z and AA boundary (#380)
    args: ["=1", '={26,27,702,703}']
    expected: [["Z1", "AA1", "ZZ1", "AAA1"]]

  - name: first column past XFD (#380)
    args: ["=1", "=16385"]
    expected: "XFE1"

  - name: 4-letter column ABCD (#380)
    args: ["=9", "=19010"]
    expected: "ABCD9"

  - name: ZZZZ and the first 5-letter column (#380)
    args: ["=7", '={475254,475255}']
    expected: [["ZZZZ7", "AAAAA7"]]

  - name: row above 1048576 (#380)
    args: ["=2000000", "=1"]
    expected: "A2000000"

  - name: row 0 gives VALUE (#380)
    args: ["=0", "=1"]
    expected: -2146826273

  - name: round trip address to row/col to address past XFD (#380)
    args: ['=ROWNUM("XFE1048577")', '=COLNUM("XFE1048577")']
    expected: "XFE1048577"
