tests:
  - name: simple position Q17
    args: ["=17000017"]
    expected: 17

  - name: position with single-digit row
    args: ["=5000005"]
    expected: 5

  - name: top-left A1
    args: ["=1000001"]
    expected: 1

  - name: composed with TOPOS
    args: ['=TOPOS("Q17")']
    expected: 17

  - name: composed with TOPOS for multi-letter col
    args: ['=TOPOS("XFD16384")']
    expected: 16384

  - name: custom mult 50
    args: ["=526", "=50"]
    expected: 10

  - name: custom mult matches TOPOS custom mult
    args: ['=TOPOS("Z10", 50)', "=50"]
    expected: 10

  - name: vertical array of positions lifts
    args: ['={1000001;5000005;17000017}']
    expected: [[1], [5], [17]]

  - name: horizontal array of positions lifts
    args: ['={1000001,5000005,17000017}']
    expected: [[1, 5, 17]]

  - name: help text
    args: []
    expected_type: array

  - name: packed row above 1048576 (#380)
    args: ["=2000000000001"]
    expected: 2000000

  - name: column past XFD does not leak into the row (#380)
    args: ['=TOPOS("ZZZZ7")']
    expected: 7
