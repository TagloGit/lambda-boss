tests:
  - name: simple position Q17
    args: ["=1700017"]
    expected: 17

  - name: position with single-digit row
    args: ["=500005"]
    expected: 5

  - name: top-left A1
    args: ["=100001"]
    expected: 1

  - name: composed with CELLTOPOS
    args: ['=CELLTOPOS("Q17")']
    expected: 17

  - name: composed with CELLTOPOS for multi-letter col
    args: ['=CELLTOPOS("XFD16384")']
    expected: 16384

  - name: custom mult 50
    args: ["=526", "=50"]
    expected: 10

  - name: custom mult matches CELLTOPOS custom mult
    args: ['=CELLTOPOS("Z10", 50)', "=50"]
    expected: 10

  - name: vertical array of positions lifts
    args: ['={100001;500005;1700017}']
    expected: [[1], [5], [17]]

  - name: horizontal array of positions lifts
    args: ['={100001,500005,1700017}']
    expected: [[1, 5, 17]]

  - name: help text
    args: []
    expected_type: array
