tests:
  - name: default mult 500005
    args: ["=500005"]
    expected: "E5"

  - name: default mult 300003
    args: ["=300003"]
    expected: "C3"

  - name: default mult 1200012
    args: ["=1200012"]
    expected: "L12"

  - name: default mult 1200028 (AB12)
    args: ["=1200028"]
    expected: "AB12"

  - name: custom mult 101
    args: ["=101", "=100"]
    expected: "A1"

  - name: custom mult 526 with mult 50
    args: ["=526", "=50"]
    expected: "Z10"

  - name: vertical array of positions lifts
    args: ['={500005;300003}']
    expected: [["E5"], ["C3"]]

  - name: horizontal array of positions lifts
    args: ['={500005,300003}']
    expected: [["E5", "C3"]]

  - name: help text
    args: []
    expected_type: array
