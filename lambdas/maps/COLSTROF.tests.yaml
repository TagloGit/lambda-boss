tests:
  - name: single letter from position E5
    args: ["=5000005"]
    expected: "E"

  - name: top-left A1
    args: ["=1000001"]
    expected: "A"

  - name: multi-letter column AB
    args: ["=12000028"]
    expected: "AB"

  - name: composed with TOPOS multi-letter
    args: ['=TOPOS("AB12")']
    expected: "AB"

  - name: composed with TOPOS last column XFD
    args: ['=TOPOS("XFD16384")']
    expected: "XFD"

  - name: custom mult 50
    args: ["=526", "=50"]
    expected: "Z"

  - name: custom mult matches TOPOS custom mult
    args: ['=TOPOS("Z10", 50)', "=50"]
    expected: "Z"

  - name: vertical array of positions lifts
    args: ['={1000001;5000005;12000028}']
    expected: [["A"], ["E"], ["AB"]]

  - name: horizontal array of positions lifts
    args: ['={1000001,5000005,12000028}']
    expected: [["A", "E", "AB"]]

  - name: help text
    args: []
    expected_type: array

  - name: first column past XFD (#380)
    args: ["=1016385"]
    expected: "XFE"

  - name: 4-letter column (#380)
    args: ["=9019010"]
    expected: "ABCD"

  - name: round trip ZZZZ via TOPOS (#380)
    args: ['=TOPOS("ZZZZ1")']
    expected: "ZZZZ"
