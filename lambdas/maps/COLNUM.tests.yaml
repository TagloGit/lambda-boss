tests:
  - name: simple address A1
    args: ["A1"]
    expected: 1

  - name: multi-letter column AA1
    args: ["AA1"]
    expected: 27

  - name: column Z
    args: ["Z1"]
    expected: 26

  - name: max column XFD
    args: ["XFD1"]
    expected: 16384

  - name: column AB
    args: ["AB12"]
    expected: 28

  - name: absolute reference dollars stripped
    args: ["$E$5"]
    expected: 5

  - name: sheet-prefixed address
    args: ["Sheet1!AA17"]
    expected: 27

  - name: lowercase address
    args: ["aa17"]
    expected: 27

  - name: cell containing address string
    setup:
      cells:
        - address: "C3"
          values: "AA17"
    args: ["=C3"]
    expected: 27

  - name: vertical array of addresses lifts
    args: ['={"A1";"Z1";"AA1"}']
    expected: [[1], [26], [27]]

  - name: horizontal array of addresses lifts
    args: ['={"A1","Z1","AA1"}']
    expected: [[1, 26, 27]]

  - name: help text
    args: []
    expected_type: array

  - name: first column past XFD (#380)
    args: ["XFE1"]
    expected: 16385

  - name: 4-letter column ABCD (#380)
    args: ["ABCD9"]
    expected: 19010

  - name: 4-letter column ZZZZ with dollars (#380)
    args: ["$ZZZZ$7"]
    expected: 475254

  - name: packed integer (#380)
    args: ["=9019010"]
    expected: 19010

  - name: unparseable text returns TOPOS message (#380)
    args: ["nonsense"]
    expected: "TOPOS: can't read 'nonsense' (not an address, direction or number)"
