tests:
  - name: up-left from E5
    args: ["E5", '="↖"']
    expected: "D4"

  - name: down from F3
    args: ["F3", '="↓"']
    expected: "F4"

  - name: down-right from G5
    args: ["G5", '="↘"']
    expected: "H6"

  - name: left from B2
    args: ["B2", '="←"']
    expected: "A2"

  - name: right from A1
    args: ["A1", '="→"']
    expected: "B1"

  - name: up from C10
    args: ["C10", '="↑"']
    expected: "C9"

  - name: knight NNE from D4 via custom moves
    args: ["D4", '="NNE"', '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},KNIGHTDELTAS())']
    expected: "E2"

  - name: knight SSE from D4 via custom moves
    args: ["D4", '="SSE"', '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},KNIGHTDELTAS())']
    expected: "E6"

  - name: address from cell containing string
    setup:
      cells:
        - address: "C3"
          values: "E5"
    args: ["=C3", '="↖"']
    expected: "D4"

  - name: round-trip own output
    args: ['=MOVECELL("E5", "↖")', '="↘"']
    expected: "E5"

  - name: vertical array of cells lifts with single direction
    args: ['={"E5";"F3";"B2"}', '="↖"']
    expected: [["D4"], ["E2"], ["A1"]]

  - name: horizontal array of cells lifts with single direction
    args: ['={"E5","F3","B2"}', '="↘"']
    expected: [["F6", "G4", "C3"]]

  - name: help text
    args: []
    expected_type: array
