tests:
  - name: up-left from E5
    args: ["E5", '="↖"']
    expected: "D4"

  - name: down from F3
    args: ["F3", '="↓"']
    expected: "F4"

  - name: down-right from G5
    args: ["G5", '="↘"']
    expected: "H6"

  - name: left from B2
    args: ["B2", '="←"']
    expected: "A2"

  - name: right from A1
    args: ["A1", '="→"']
    expected: "B1"

  - name: up from C10
    args: ["C10", '="↑"']
    expected: "C9"

  - name: numeric dir 1 moves right
    args: ["E5", "=1"]
    expected: "F5"

  - name: numeric dir -1 moves left
    args: ["B2", "=-1"]
    expected: "A2"

  - name: numeric dir 1000000 moves down
    args: ["F3", "=1000000"]
    expected: "F4"

  - name: numeric dir -1000000 moves up
    args: ["C10", "=-1000000"]
    expected: "C9"

  - name: numeric dir -1000001 moves up-left
    args: ["E5", "=-1000001"]
    expected: "D4"

  - name: numeric dir 999999 moves down-left
    args: ["E5", "=999999"]
    expected: "D6"

  - name: numeric dir 0 stays put
    args: ["E5", "=0"]
    expected: "E5"

  - name: numeric dir with multi-step
    args: ["A1", "=1", "=3"]
    expected: "D1"

  - name: numeric dir negative steps reverses direction
    args: ["D4", "=1", "=-2"]
    expected: "B4"

  - name: numeric knight delta bypasses moves table
    args: ["D4", "=-1999999"]
    expected: "E2"

  - name: numeric dir respects bounds clip
    args: ["D2", "=1", "=5", "=", '="A1:E5"']
    expected: "E2"

  - name: numeric dir wraps at bounds
    args: ["E3", "=1", "=1", "=", '="A1:E5"', "=3"]
    expected: "A3"

  - name: multi-step right from A1
    args: ["A1", '="→"', "=3"]
    expected: "D1"

  - name: multi-step up-left from F6
    args: ["F6", '="↖"', "=2"]
    expected: "D4"

  - name: negative steps reverses direction
    args: ["D4", '="→"', "=-2"]
    expected: "B4"

  - name: zero steps returns same cell
    args: ["E5", '="↖"', "=0"]
    expected: "E5"

  - name: vertical array of steps traces path
    args: ["A1", '="→"', "=SEQUENCE(3)"]
    expected: [["B1"], ["C1"], ["D1"]]

  - name: horizontal array of steps traces path
    args: ["A1", '="↓"', "=SEQUENCE(1,3)"]
    expected: [["A2", "A3", "A4"]]

  - name: cells column x steps row builds grid
    args: ['={"A1";"B2"}', '="→"', "={1,2,3}"]
    expected: [["B1", "C1", "D1"], ["C2", "D2", "E2"]]

  - name: knight NNE from D4 via custom moves
    args: ["D4", '="NNE"', "=1", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)']
    expected: "E2"

  - name: knight SSE from D4 via custom moves
    args: ["D4", '="SSE"', "=1", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)']
    expected: "E6"

  - name: knight NNE two steps from D10
    args: ["D10", '="NNE"', "=2", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)']
    expected: "F6"

  - name: address from cell containing string
    setup:
      cells:
        - address: "C3"
          values: "E5"
    args: ["=C3", '="↖"']
    expected: "D4"

  - name: round-trip own output
    args: ['=MOVECELL("E5", "↖")', '="↘"']
    expected: "E5"

  - name: vertical array of cells lifts with single direction
    args: ['={"E5";"F3";"B2"}', '="↖"']
    expected: [["D4"], ["E2"], ["A1"]]

  - name: horizontal array of cells lifts with single direction
    args: ['={"E5","F3","B2"}', '="↘"']
    expected: [["F6", "G4", "C3"]]

  - name: clip at right edge of text bounds (overflow omitted defaults to clip)
    args: ["D2", '="→"', "=5", "=", '="A1:E5"']
    expected: "E2"

  - name: clip diagonal slides along wall (col clamps, row continues)
    args: ["B2", '="↘"', "=2", "=", '="A1:C5"']
    expected: "C4"

  - name: clip within bounds is a no-op
    args: ["B2", '="→"', "=2", "=", '="A1:E5"']
    expected: "D2"

  - name: error mode returns NA when move exits bounds
    args: ["E2", '="→"', "=2", "=", '="A1:E5"', "=1"]
    expected: -2146826246

  - name: error mode in bounds returns address
    args: ["C3", '="→"', "=1", "=", '="A1:E5"', "=1"]
    expected: "D3"

  - name: stick mode refuses out-of-bounds move
    args: ["E2", '="→"', "=1", "=", '="A1:E5"', "=2"]
    expected: "E2"

  - name: stick mode in bounds proceeds
    args: ["D2", '="→"', "=1", "=", '="A1:E5"', "=2"]
    expected: "E2"

  - name: wrap right edge to left edge
    args: ["E3", '="→"', "=1", "=", '="A1:E5"', "=3"]
    expected: "A3"

  - name: wrap multi-cell overshoot
    args: ["A1", '="→"', "=7", "=", '="A1:E5"', "=3"]
    expected: "C1"

  - name: wrap upward off the top reappears at the bottom
    args: ["A1", '="↑"', "=1", "=", '="A1:E5"', "=3"]
    expected: "A5"

  - name: bounce reflects off right edge
    args: ["D2", '="→"', "=3", "=", '="A1:E5"', "=4"]
    expected: "C2"

  - name: bounce reflects off top edge
    args: ["B2", '="↑"', "=3", "=", '="A1:E5"', "=4"]
    expected: "B3"

  - name: bounce on single-row area stays on the row
    args: ["C1", '="↓"', "=3", "=", '="A1:E1"', "=4"]
    expected: "C1"

  - name: bounds omitted with overflow supplied clips to sheet
    args: ["A1", '="←"', "=1", "=", "=", "=0"]
    expected: "A1"

  - name: sheet bounds error mode above row 1
    args: ["A1", '="↑"', "=1", "=", "=", "=1"]
    expected: -2146826246

  - name: reference bounds via named range
    setup:
      names:
        - { name: "Board", refers_to: "G3:I5" }
    args: ["H4", '="↘"', "=5", "=", "=Board"]
    expected: "I5"

  - name: single-cell text bounds is a 1x1 area
    args: ["C3", '="→"', "=1", "=", '="C3"']
    expected: "C3"

  - name: reversed-corner text bounds are normalised
    args: ["D2", '="→"', "=5", "=", '="E5:A1"']
    expected: "E2"

  - name: knight move refused by stick bounds
    args: ["B4", '="NNE"', "=1", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)', '="A3:E7"', "=2"]
    expected: "B4"

  - name: steps array traces wrapping path
    args: ["E1", '="→"', "=SEQUENCE(3)", "=", '="A1:E5"', "=3"]
    expected: [["A1"], ["B1"], ["C1"]]

  - name: cells column x steps row grid clips element-wise
    args: ['={"C1";"D1"}', '="→"', "={1,2}", "=", '="A1:E5"']
    expected: [["D1", "E1"], ["E1", "E1"]]

  - name: compass token NE moves up-right
    args: ["E5", "NE"]
    expected: "F4"

  - name: compass token lowercase w moves left
    args: ["B2", "w"]
    expected: "A2"

  - name: long compass token with hyphen moves down-left
    args: ["E5", "south-west"]
    expected: "D6"

  - name: screen token UL moves up-left
    args: ["E5", "UL"]
    expected: "D4"

  - name: screen token DR with multi-step
    args: ["A1", "DR", "=3"]
    expected: "D4"

  - name: word token down moves down
    args: ["F3", "down"]
    expected: "F4"

  - name: token dir respects bounds clip
    args: ["D2", "R", "=5", "=", '="A1:E5"']
    expected: "E2"

  - name: custom moves glyph wins over token fallback
    args: ["D4", '="NNE"', "=1", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)']
    expected: "E2"

  - name: token falls back through custom moves table to compass
    args: ["D4", "NE", "=1", '=HSTACK({"NNE";"ENE";"ESE";"SSE";"SSW";"WSW";"WNW";"NNW"},_dirKnight)']
    expected: "E3"

  - name: unrecognised dir text returns NA
    args: ["E5", "XX"]
    expected: -2146826246

  - name: right from XFD goes past the sheet edge (#380)
    args: ["XFD5", '="→"']
    expected: "XFE5"

  - name: down from row 1048576 goes past the sheet edge (#380)
    args: ["ZZZ1048576", '="↓"']
    expected: "ZZZ1048577"

  - name: left from XFE comes back to XFD (#380)
    args: ["XFE5", '="←"']
    expected: "XFD5"

  - name: packed integer cell decodes at _mult (#380)
    args: ["=5000005", '="→"']
    expected: "F5"

  - name: packed integer with numeric dir (#380)
    args: ["=5000005", "=_dirS"]
    expected: "E6"

  - name: steps array crossing XFD (#380)
    args: ["XFC5", '="→"', '={1,2,3}']
    expected: [["XFD5", "XFE5", "XFF5"]]

  - name: clip to bounds past XFD (#380)
    args: ["XFD5", '="→"', "=3", "=", '="XFC1:XFF9"']
    expected: "XFF5"

  - name: wrap within bounds past XFD (#380)
    args: ["XFF5", '="→"', "=1", "=", '="XFC1:XFF9"', "=3"]
    expected: "XFC5"

  - name: 4-letter column moves (#380)
    args: ["ABCD9", '="NE"', "=2"]
    expected: "ABCF7"

  - name: old 100000-packed numeric dir gives a readable message (#380 review)
    args: ["E5", "=100000"]
    expected: "MOVECELL: dir 100000 has a column step of 100000; numeric dirs are packed rowDelta*_mult+colDelta (_mult = 1000000), e.g. _dirS"

  - name: unparseable cell passes TOPOS message through (#380 review)
    args: ["ZZ", '="→"']
    expected: "TOPOS: can't read 'ZZ' (not an address, direction or number)"

  - name: overflow without bounds still clips at the sheet edge (#380 review)
    args: ["XFC5", '="→"', "=5", "=", "=", "=0"]
    expected: "XFD5"

  - name: 2-column moves HSTACK(glyphs, _dirKnight) - letter d is SSE from D4
    args: ["D4", '="d"', "=1", '=HSTACK({"a";"b";"c";"d";"e";"f";"g";"h"},_dirKnight)']
    expected: "E6"

  - name: 2-column moves HSTACK(glyphs, _dirKnight) - letter h is NNW from D4
    args: ["D4", '="h"', "=1", '=HSTACK({"a";"b";"c";"d";"e";"f";"g";"h"},_dirKnight)']
    expected: "C2"

  - name: old 3-column moves table {glyph, dRow, dCol} still works
    args: ["D4", '="x"', "=1", '={"x",-2,1;"y",1,2}']
    expected: "E2"

  - name: old 3-column moves table - second row, two steps
    args: ["D4", '="y"', "=2", '={"x",-2,1;"y",1,2}']
    expected: "H6"

  - name: default ARROWMOVES table moves a glyph right
    args: ["B2", '="→"', "=3"]
    expected: "E2"

  - name: 2-column table holding an old 100000-packed delta gives a readable message
    args: ["D4", '="v"', "=1", '={"v",100000}']
    expected: "MOVECELL: dir v has a column step of 100000; numeric dirs and 2-column moves tables are packed rowDelta*_mult+colDelta (_mult = 1000000), e.g. _dirS"
