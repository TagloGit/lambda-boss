tests:
  - name: compass short code to packed delta
    args: ["NE"]
    expected: -99999

  - name: arrow glyph to packed delta
    args: ["↘"]
    expected: 100001

  - name: compass long form with hyphen and mixed case
    args: ["north-east"]
    expected: -99999

  - name: screen long form with space
    args: ["up left"]
    expected: -100001

  - name: reversed two-letter screen form
    args: ["LD"]
    expected: 99999

  - name: single letter screen form
    args: ["d"]
    expected: 100000

  - name: numeric delta passes through in delta mode
    args: ["=-100000"]
    expected: -100000

  - name: non-compass numeric delta (knight move) passes through in delta mode
    args: ["=-199998"]
    expected: -199998

  - name: numeric delta to arrow glyph
    args: ["=-99999", "=1"]
    expected: "↗"

  - name: token to arrow glyph
    args: ["DownRight", "=1"]
    expected: "↘"

  - name: arrow glyph to compass code
    args: ["←", "=2"]
    expected: "W"

  - name: non-compass numeric delta errors in arrow mode
    args: ["=-199998", "=1"]
    expected: -2146826246

  - name: unrecognised token returns NA
    args: ["XX"]
    expected: -2146826246

  - name: horizontal array of screen tokens lifts
    args: ['={"D","R","L","U"}']
    expected: [[100000, 1, -1, -100000]]

  - name: vertical array of mixed spellings lifts
    args: ['={"N";"↘";"west"}']
    expected: [[-100000], [100001], [-1]]

  - name: 1x1 array input behaves as scalar
    args: ['=CHOOSEROWS({"NE";"SW"},1)']
    expected: -99999

  - name: help text
    args: []
    expected_type: array
