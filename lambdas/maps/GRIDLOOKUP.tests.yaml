tests:
  - name: find 41 in 10x10 SEQUENCE grid
    args: ["=SEQUENCE(10,10)", "=41"]
    expected: "A5"

  - name: find 1 in 10x10 SEQUENCE grid (top-left)
    args: ["=SEQUENCE(10,10)", "=1"]
    expected: "A1"

  - name: find 100 in 10x10 SEQUENCE grid (bottom-right)
    args: ["=SEQUENCE(10,10)", "=100"]
    expected: "J10"

  - name: find 5 in 2x5 SEQUENCE grid
    args: ["=SEQUENCE(2,5)", "=5"]
    expected: "E1"

  - name: find 6 in 2x5 SEQUENCE grid
    args: ["=SEQUENCE(2,5)", "=6"]
    expected: "A2"

  - name: reverse lookup A1 in 10x10 SEQUENCE grid
    args: ["=SEQUENCE(10,10)", '="A1"', "=TRUE"]
    expected: 1

  - name: reverse lookup J10 in 10x10 SEQUENCE grid
    args: ["=SEQUENCE(10,10)", '="J10"', "=TRUE"]
    expected: 100

  - name: reverse lookup A5 in 10x10 SEQUENCE grid
    args: ["=SEQUENCE(10,10)", '="A5"', "=TRUE"]
    expected: 41

  - name: reverse lookup from cell containing address string
    setup:
      cells:
        - address: "C3"
          values: "A5"
    args: ["=SEQUENCE(10,10)", "=C3", "=TRUE"]
    expected: 41

  - name: reverse lookup via encoded position integer (A5 = 5000001)
    args: ["=SEQUENCE(10,10)", "=5000001", "=TRUE"]
    expected: 41

  - name: reverse lookup via encoded position integer (J10 = 10000010)
    args: ["=SEQUENCE(10,10)", "=10000010", "=TRUE"]
    expected: 100

  - name: off-grid position (row 0) returns NA by default
    args: ["=SEQUENCE(10,10)", "=11", "=TRUE"]
    expected: -2146826246

  - name: off-grid position returns if_invalid when supplied
    args: ["=SEQUENCE(10,10)", "=11", "=TRUE", "=0", "=-1"]
    expected: -1

  - name: in-sheet address outside grid (K2) returns NA by default
    args: ["=SEQUENCE(10,10)", '="K2"', "=TRUE"]
    expected: -2146826246

  - name: error input is replaced by if_invalid (not propagated)
    args: ["=SEQUENCE(10,10)", "=1/0", "=TRUE", "=0", "=-1"]
    expected: -1

  - name: match_mode 1 finds next larger value
    args: ["=SEQUENCE(10,10)", "=99.5", "=FALSE", "=1"]
    expected: "J10"

  - name: match_mode -1 finds next smaller value
    args: ["=SEQUENCE(10,10)", "=41.5", "=FALSE", "=-1"]
    expected: "A5"

  - name: find cell of MAX via match_mode 1 with large sentinel
    args: ["=SEQUENCE(10,10)", "=9999", "=FALSE", "=-1"]
    expected: "J10"

  - name: forward miss returns NA by default
    args: ["=SEQUENCE(10,10)", "=999"]
    expected: -2146826246

  - name: forward miss returns if_invalid when supplied
    args: ["=SEQUENCE(10,10)", "=999", "=FALSE", "=0", "=-1"]
    expected: -1

  - name: forward lookup lifts over vertical array of values
    args: ["=SEQUENCE(10,10)", '={1;41;100}']
    expected: [["A1"], ["A5"], ["J10"]]

  - name: reverse lookup lifts over vertical array of addresses
    args: ["=SEQUENCE(10,10)", '={"A1";"A5";"J10"}', "=TRUE"]
    expected: [[1], [41], [100]]

  - name: reverse lift over positions with one off-grid uses if_invalid
    args: ["=SEQUENCE(10,10)", '={5000001;11}', "=TRUE", "=0", "=-1"]
    expected: [[41], [-1]]

  - name: origin anchors forward lookup (value 1 -> anchor cell C3)
    args: ["=SEQUENCE(10,10)", "=1", "=", "=", "=", "=C3"]
    expected: "C3"

  - name: origin anchors forward lookup (value 41 -> C7)
    args: ["=SEQUENCE(10,10)", "=41", "=", "=", "=", "=C3"]
    expected: "C7"

  - name: origin anchors reverse lookup (anchor cell C3 -> value 1)
    args: ["=SEQUENCE(10,10)", '="C3"', "=TRUE", "=", "=", "=C3"]
    expected: 1

  - name: origin anchors reverse lookup (C7 -> value 41)
    args: ["=SEQUENCE(10,10)", '="C7"', "=TRUE", "=", "=", "=C3"]
    expected: 41

  - name: origin as a range uses its top-left (C3:E5 -> C3 frame)
    args: ["=SEQUENCE(10,10)", "=1", "=", "=", "=", "=C3:E5"]
    expected: "C3"

  - name: address outside anchored grid returns NA by default
    args: ["=SEQUENCE(10,10)", '="A1"', "=TRUE", "=", "=", "=C3"]
    expected: -2146826246

  - name: packed integer built from _mult (#380)
    args: ["=SEQUENCE(10,10)", "=5*_mult+1", "=TRUE"]
    expected: 41

  # Edge cases for the hot-loop rewrite (#412)
  - name: reverse on a text grid by address
    args: ['=IF(SEQUENCE(5,5),"W")', '="E5"', "=TRUE"]
    expected: "W"

  - name: reverse at the bottom-right corner by packed position
    args: ["=SEQUENCE(10,10)", "=10*_mult+10", "=TRUE"]
    expected: 100

  - name: reverse off the bottom edge returns NA
    args: ["=SEQUENCE(10,10)", '="A11"', "=TRUE"]
    expected: -2146826246

  - name: reverse off the right edge returns if_invalid
    args: ["=SEQUENCE(10,10)", "=1*_mult+11", "=TRUE", "=0", "=-1"]
    expected: -1

  - name: reverse at column 0 returns NA, not a whole row
    args: ["=SEQUENCE(10,10)", "=5*_mult", "=TRUE"]
    expected: -2146826246

  - name: reverse with a 1x1 array value
    args: ["=SEQUENCE(10,10)", '={"A5"}', "=TRUE"]
    expected: 41

  - name: reverse lift over packed positions, off the bottom uses if_invalid
    args: ["=SEQUENCE(10,10)", "={1000001;11000001}", "=TRUE", "=0", "=-1"]
    expected: [[1], [-1]]

  - name: reverse on a worksheet range uses sheet addresses
    setup:
      cells:
        - address: "C5:E7"
          values:
            - [1, 2, 3]
            - [4, 5, 6]
            - [7, 8, 9]
      names:
        - { name: "glgrid", refers_to: "C5:E7" }
    args: ["=glgrid", '="D6"', "=TRUE"]
    expected: 5

  - name: forward on a worksheet range returns the sheet address
    setup:
      cells:
        - address: "C5:E7"
          values:
            - [1, 2, 3]
            - [4, 5, 6]
            - [7, 8, 9]
      names:
        - { name: "glgrid", refers_to: "C5:E7" }
    args: ["=glgrid", "=9"]
    expected: "E7"

  - name: forward lift with origin anchors each result
    args: ["=SEQUENCE(10,10)", "={1;41}", "=", "=", "=", "=C3"]
    expected: [["C3"], ["C7"]]

  - name: reverse lift with origin anchors each lookup
    args: ["=SEQUENCE(10,10)", '={"C3";"C7";"A1"}', "=TRUE", "=", "=-1", "=C3"]
    expected: [[1], [41], [-1]]

  - name: reverse with a fractional column just past the right edge returns NA
    args: ["=SEQUENCE(10,10)", "=10*_mult+10.5", "=TRUE"]
    expected: -2146826246

  - name: reverse with a fractional column inside the grid truncates
    args: ["=SEQUENCE(10,10)", "=1*_mult+5.5", "=TRUE"]
    expected: 5

  - name: reverse lift over a worksheet range, one address off it
    setup:
      cells:
        - address: "C5:E7"
          values:
            - [1, 2, 3]
            - [4, 5, 6]
            - [7, 8, 9]
      names:
        - { name: "glgrid", refers_to: "C5:E7" }
    args: ["=glgrid", '={"C5","E7";"D6","B5"}', "=TRUE", "=", "=0"]
    expected: [[1, 9], [5, 0]]

  - name: forward lift over a 2-D array of values with a miss
    args: ["=SEQUENCE(10,10)", "={1,100;57,999}", "=", "=", '="none"']
    expected: [["A1", "J10"], ["G6", "none"]]
