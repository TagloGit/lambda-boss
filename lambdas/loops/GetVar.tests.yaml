tests:
  - name: round-trip scalar number
    args: ['=SetVar(NewState(), "x", 5)', "x"]
    expected: 5

  - name: round-trip after replacement returns latest value
    args: ['=SetVar(SetVar(NewState(), "x", 5), "x", 7)', "x"]
    expected: 7

  - name: read second var after appending
    args: ['=SetVar(SetVar(NewState(), "x", 5), "y", 7)', "y"]
    expected: 7

  - name: read first var still works after appending second
    args: ['=SetVar(SetVar(NewState(), "x", 5), "y", 7)', "x"]
    expected: 5

  - name: missing var returns NA
    args: ['=SetVar(NewState(), "x", 5)', "missing"]
    expected: -2146826246

  - name: read from empty state returns NA
    args: ['=NewState()', "anything"]
    expected: -2146826246

  - name: prefix collision - reading "abc" must not match "ab"
    args: ['=SetVar(NewState(), "ab", 1)', "abc"]
    expected: -2146826246

  - name: prefix collision - reading "ab" with both "ab" and "abc" set
    args: ['=SetVar(SetVar(NewState(), "ab", 1), "abc", 2)', "ab"]
    expected: 1

  - name: numeric array round-trips as vertical numeric array
    args: ['=SetVar(NewState(), "arr", {10;20;30})', "arr"]
    expected: [[10], [20], [30]]

  - name: 1x1 array collapses to scalar (Excel can't distinguish from scalar)
    args: ['=SetVar(NewState(), "arr", SEQUENCE(1,1,42))', "arr"]
    expected: 42

  - name: text scalar round-trips as text
    args: ['=SetVar(NewState(), "name", "hello")', "name"]
    expected: "hello"

  - name: boolean scalar round-trips as boolean
    args: ['=SetVar(NewState(), "done?", TRUE)', "done?"]
    expected: True

  - name: boolean array round-trips element-wise
    args: ['=SetVar(NewState(), "flags", {TRUE;FALSE;TRUE})', "flags"]
    expected: [[True], [False], [True]]

  - name: broadcast number scalar over column of states
    args: ['=VSTACK(SetVar(NewState(), "x", 5), SetVar(NewState(), "x", 10), SetVar(NewState(), "x", 15))', "x"]
    expected: [[5], [10], [15]]

  - name: broadcast preserves boolean type per row
    args: ['=VSTACK(SetVar(NewState(), "done?", TRUE), SetVar(NewState(), "done?", FALSE))', "done?"]
    expected: [[True], [False]]

  - name: broadcast preserves text type per row
    args: ['=VSTACK(SetVar(NewState(), "name", "alice"), SetVar(NewState(), "name", "bob"))', "name"]
    expected: [["alice"], ["bob"]]

  # #376: a 1x1 array value used to make every later entry unreadable
  - name: var set after a 1x1 array value is still readable
    args: ['=SetVar(SetVar(SetVar(NewState(), "a", 1), "pos", {"AY50"}), "dir", "E")', "dir"]
    expected: "E"

  - name: 1x1 array state keeps every entry readable
    args: ['=IF(SEQUENCE(1), SetVars("a", 1, "b", 2))', "b"]
    expected: "2"

  - name: var set under a 1x1 array name survives a later SetVar
    args: ['=SetVar(SetVar(NewState(), {"y"}, 7), "z", 1)', "y"]
    expected: "7"

  - name: name match ignores case
    args: ['=SetVar(NewState(), "best", 5)', "BEST"]
    expected: 5

  - name: a name inside an earlier entry's key is not a match
    args: ['=SetVars("abc", 1, "b", 2)', "b"]
    expected: 2

  - name: a name inside an earlier entry's value is not a match
    args: ['=SetVars("t", "xbx", "b", 2)', "b"]
    expected: 2

  - name: a name with wildcard characters matches literally
    args: ['=SetVars("a?", 1, "ab", 2)', "a?"]
    expected: 1

  - name: broadcast with a missing state row returns NA for that row
    args: ['=VSTACK(SetVar(NewState(), "x", 5), SetVar(NewState(), "y", 6))', "x"]
    expected: [[5], [-2146826246]]

  # #407: DROP to one row leaves a 1x1 array. Stored as a scalar, so REDUCE and SCAN agree.
  - name: SetVars with a 1x1 array value keeps a later array variable readable
    args: ['=SetVars("path", DROP({"E4";"E3"}, -1), "seen", {"E4";"E3"})', "seen"]
    expected: [["E4"], ["E3"]]

  - name: SetVar chain with a 1x1 array value keeps a later array variable readable
    args: ['=SetVar(SetVar(NewState(), "path", DROP({"E4";"E3"}, -1)), "seen", {"E4";"E3"})', "seen"]
    expected: [["E4"], ["E3"]]

  - name: REDUCE step shrinking a list to one row keeps every variable readable
    args: ['=REDUCE(SetVars("path", {"E4";"E3";"E2"}, "n", 0), {1;2}, LAMBDA(a, v, SetVars("path", DROP(GetVar(a, "path"), -1), "n", GetVar(a, "n") + 1)))', "n"]
    expected: 2

  - name: SCAN gives the same state as REDUCE for that step
    args: ['=INDEX(SCAN(SetVars("path", {"E4";"E3";"E2"}, "n", 0), {1;2}, LAMBDA(a, v, SetVars("path", DROP(GetVar(a, "path"), -1), "n", GetVar(a, "n") + 1))), 2)', "n"]
    expected: 2

  - name: REDUCE step retreating to one row keeps the longer list
    args: ['=REDUCE(SetVars("path", {"E4";"E3"}, "seen", {"E4";"E3"}), {1;2}, LAMBDA(a, v, SetVars("path", IF(ROWS(GetVar(a, "path")) > 1, DROP(GetVar(a, "path"), -1), GetVar(a, "path")), "seen", GetVar(a, "seen"))))', "seen"]
    expected: [["E4"], ["E3"]]

  - name: a 1x1 array state from the step's own IF stays readable through REDUCE
    args: ['=REDUCE(SetVars("p", {1;2}, "q", 3), {1;2;3}, LAMBDA(a, v, IF({TRUE}, SetVar(a, "q", GetVar(a, "q") + v))))', "p"]
    expected: [[1], [2]]

  # #437: a 1x1 array value (VSTACK of one cell, DROP to one row, a one-row FILTER) through REDUCE.
  # Tim's #N/A came from a 12 Sep copy of the library (before #377); these pin the fixed engine.
  - name: REDUCE seeded with a 1x1 VSTACK through SetVars (Tim's walk, #437)
    args: ['=REDUCE(SetVars("visited", VSTACK("A1"), "p", "A1"), SEQUENCE(1), LAMBDA(a, v, LET(visited, GetVar(a, "visited"), p, GetVar(a, "p"), nextVisited, visited, nextP, p, SetVars("visited", nextVisited, "p", nextP))))', "p"]
    expected: "A1"

  - name: REDUCE seeded with a 1x1 VSTACK grows the list through SetVars
    args: ['=REDUCE(SetVars("visited", VSTACK("A1"), "p", "A1"), SEQUENCE(2), LAMBDA(a, v, SetVars("visited", VSTACK(GetVar(a, "visited"), "B" & v), "p", "B" & v)))', "visited"]
    expected: [["A1"], ["B1"], ["B2"]]

  - name: REDUCE seeded with a 1x1 VSTACK through a SetVar chain
    args: ['=REDUCE(SetVar(SetVar(NewState(), "visited", VSTACK("A1")), "p", "A1"), SEQUENCE(2), LAMBDA(a, v, SetVar(SetVar(a, "visited", GetVar(a, "visited")), "p", GetVar(a, "p") & v)))', "p"]
    expected: "A112"

  - name: SetVar chain under REDUCE with DROP to one row keeps the next variable
    args: ['=REDUCE(SetVar(NewState(), "path", {"E4";"E3"}), SEQUENCE(1), LAMBDA(a, v, SetVar(SetVar(a, "path", DROP(GetVar(a, "path"), -1)), "n", 1)))', "n"]
    expected: 1

  - name: one-row FILTER through SetVars under REDUCE
    args: ['=REDUCE(SetVars("hits", FILTER({"a";"b"}, {TRUE;FALSE}), "n", 0), {1;2}, LAMBDA(a, v, SetVars("hits", FILTER(VSTACK(GetVar(a, "hits"), "z"), VSTACK(TRUE, FALSE)), "n", GetVar(a, "n") + 1)))', "n"]
    expected: 2

  - name: one-row FILTER through a SetVar chain under REDUCE
    args: ['=REDUCE(SetVar(NewState(), "hits", FILTER({"a";"b"}, {FALSE;TRUE})), {1;2}, LAMBDA(a, v, SetVar(SetVar(a, "hits", FILTER(GetVar(a, "hits"), TRUE)), "n", v)))', "hits"]
    expected: "b"

  # #442: an error is kept, in place, and comes back as itself
  - name: an error in an array variable comes back in place
    args: ['=SetVars("a", 1, "ns", {1;2}/{1;0})', "ns"]
    expected: [[1], [-2146826281]]

  - name: an error in an array variable leaves the other variables readable
    args: ['=SetVars("a", 1, "ns", {1;2}/{1;0})', "a"]
    expected: 1

  - name: an error entry keeps each element's type
    args: ['=SetVars("m", IF({TRUE;TRUE;TRUE;FALSE}, {1;"x";TRUE;0}, #VALUE!))', "m"]
    expected: [[1], ["x"], [True], [-2146826273]]

  - name: a scalar error variable comes back as the error
    args: ['=SetVars("a", 1, "e", 1/0)', "e"]
    expected: -2146826281

  - name: SetVar keeps a scalar error
    args: ['=SetVar(SetVar(NewState(), "a", 1), "e", NA())', "e"]
    expected: -2146826246

  - name: SetVar keeps an error in an array
    args: ['=SetVar(NewState(), "ns", IF({TRUE;FALSE;TRUE}, {"B1";"";"A2"}, #VALUE!))', "ns"]
    expected: [["B1"], [-2146826273], ["A2"]]

  - name: CALC error round-trips
    args: ['=SetVars("c", FILTER(0, FALSE))', "c"]
    expected: -2146826238

  - name: a repeated name with an error value takes the chain and keeps it
    args: ['=SetVars("x", 1, "x", NA())', "x"]
    expected: -2146826246

  - name: REDUCE carries an error array and keeps counting
    args: ['=REDUCE(SetVars("ns", {1;2}, "n", 0), {1;2;3}, LAMBDA(a, v, SetVars("ns", GetVar(a, "ns")/{1;0}, "n", GetVar(a, "n") + 1)))', "n"]
    expected: 3

  - name: REDUCE carries an error array in place
    args: ['=REDUCE(SetVars("ns", {1;2}, "n", 0), {1;2;3}, LAMBDA(a, v, SetVars("ns", GetVar(a, "ns")/{1;0}, "n", GetVar(a, "n") + 1)))', "ns"]
    expected: [[1], [-2146826281]]

  - name: REDUCE carries a scalar error read back with GetVar
    args: ['=REDUCE(SetVars("e", 1/0, "n", 0), {1;2;3}, LAMBDA(a, v, SetVars("e", GetVar(a, "e"), "n", GetVar(a, "n") + 1)))', "e"]
    expected: -2146826281

  - name: SCAN step holding an error array reads back in place
    args: ['=INDEX(SCAN(SetVars("ns", {1;2}, "n", 0), {1;2}, LAMBDA(a, v, SetVars("ns", {1;2}/{1;0} * v, "n", GetVar(a, "n") + 1))), 2)', "ns"]
    expected: [[2], [-2146826281]]

  - name: broadcast over a column of states with an error row
    args: ['=VSTACK(SetVars("e", 1), SetVars("e", 1/0), SetVars("e", 3))', "e"]
    expected: [[1], [-2146826281], [3]]
