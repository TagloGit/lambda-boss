tests:
  - name: scalar state - one numeric var returns native number
    args: ['=SetVars("cur", 1)']
    expected: 1

  - name: scalar state - two numeric vars returns 1x2 row of numbers
    args: ['=SetVars("cur", 1, "best", 5)']
    expected: [[1, 5]]

  - name: scalar state - mixed scalar number and array
    args: ['=SetVars("cur", 1, "ends", {1;3;7})']
    expected: [[1, "[1, 3, 7]"]]

  - name: scalar state - boolean coerces to native boolean
    args: ['=SetVars("done?", TRUE, "n", 5)']
    expected: [[True, 5]]

  - name: scalar state - text stays as text
    args: ['=SetVars("name", "alice", "n", 1)']
    expected: [["alice", 1]]

  - name: column of states - VSTACKed numbers stay numeric
    args: ['=VSTACK(SetVars("a", 1, "b", 2), SetVars("a", 3, "b", 4))']
    expected:
      - [1, 2]
      - [3, 4]

  - name: column of three states with array values
    args:
      [
        '=VSTACK(SetVars("cur", 1, "ends", {7}), SetVars("cur", 2, "ends", {7;9}), SetVars("cur", 3, "ends", {7;9;11}))',
      ]
    expected:
      - [1, 7]
      - [2, "[7, 9]"]
      - [3, "[7, 9, 11]"]

  - name: empty state shows placeholder
    args: ['=NewState()']
    expected: "(empty)"

  - name: help text
    args: []
    expected_type: array
