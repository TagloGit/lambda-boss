tests:
  - name: scalar state - one numeric var returns native number
    args: ['=SetVars("cur", 1)']
    expected: 1

  - name: scalar state - two numeric vars returns 1x2 row of numbers
    args: ['=SetVars("cur", 1, "best", 5)']
    expected: [[1, 5]]

  - name: scalar state - mixed scalar number and array
    args: ['=SetVars("cur", 1, "ends", {1;3;7})']
    expected: [[1, "[1, 3, 7]"]]

  - name: scalar state - boolean coerces to native boolean
    args: ['=SetVars("done?", TRUE, "n", 5)']
    expected: [[True, 5]]

  - name: scalar state - text stays as text
    args: ['=SetVars("name", "alice", "n", 1)']
    expected: [["alice", 1]]

  - name: column of states - VSTACKed numbers stay numeric
    args: ['=VSTACK(SetVars("a", 1, "b", 2), SetVars("a", 3, "b", 4))']
    expected:
      - [1, 2]
      - [3, 4]

  - name: column of three states with array values
    args:
      [
        '=VSTACK(SetVars("cur", 1, "ends", {7}), SetVars("cur", 2, "ends", {7;9}), SetVars("cur", 3, "ends", {7;9;11}))',
      ]
    expected:
      - [1, 7]
      - [2, "[7, 9]"]
      - [3, "[7, 9, 11]"]

  - name: empty state shows placeholder
    args: ['=NewState()']
    expected: "(empty)"

  - name: include headers prepends variable names row
    args: ['=SetVars("cur", 1, "best", 5)', "=TRUE"]
    expected:
      - ["cur", "best"]
      - [1, 5]

  - name: include headers with column of states
    args:
      [
        '=VSTACK(SetVars("a", 1, "b", 2), SetVars("a", 3, "b", 4))',
        "=TRUE",
      ]
    expected:
      - ["a", "b"]
      - [1, 2]
      - [3, 4]

  - name: include headers FALSE matches default behaviour
    args: ['=SetVars("cur", 1, "best", 5)', "=FALSE"]
    expected: [[1, 5]]

  # #407: a 1x1 array state from the step's own IF keeps every variable
  - name: 1x1 array state keeps later variables
    args: ['=REDUCE(SetVars("p", {1;2}, "q", 3), {1;2;3}, LAMBDA(a, v, IF({TRUE}, SetVar(a, "q", GetVar(a, "q") + v))))', "=TRUE"]
    expected: [["p", "q"], ["[1, 2]", 9]]

  # Spec 0011 part 5: every row is read by the first state's names, not by position
  - name: SetVar-reordered row lines up by name
    args: ['=VSTACK(SetVars("p", 0, "b", 4), SetVar(SetVars("p", 0, "b", 4), "p", 1))', "=TRUE"]
    expected:
      - ["p", "b"]
      - [0, 4]
      - [1, 4]

  - name: SetVar step traced with SCAN lines up by name
    args: ['=LET(seed, SetVars("p", 0, "b", 4), VSTACK(seed, SCAN(seed, {1;2;3}, LAMBDA(a, v, SetVar(a, "p", GetVar(a, "p") + v)))))', "=TRUE"]
    expected:
      - ["p", "b"]
      - [0, 4]
      - [1, 4]
      - [3, 4]
      - [6, 4]

  - name: missing key gives NA in that row only
    args: ['=VSTACK(SetVars("p", 1, "b", 2), SetVars("p", 3), SetVars("b", 6, "p", 5))']
    expected:
      - [1, 2]
      - [3, -2146826246]
      - [5, 6]

  - name: keys only later rows hold are not shown
    args: ['=VSTACK(SetVars("p", 1), SetVars("p", 2, "n", 9))', "=TRUE"]
    expected:
      - ["p"]
      - [1]
      - [2]

  - name: names are read ignoring case
    args: ['=VSTACK(SetVars("best", 1), SetVars("BEST", 2))']
    expected:
      - [1]
      - [2]

  - name: a name inside another entry is not a match
    args: ['=VSTACK(SetVars("b", 1, "x", 0), SetVars("abc", 7, "x", "xbx", "b", 2))']
    expected:
      - [1, 0]
      - [2, "xbx"]

  - name: empty first state leaves later rows without keys
    args: ['=VSTACK(NewState(), SetVars("a", 1))']
    expected:
      - ["(empty)"]
      - [-2146826246]

  - name: a value that changes type between rows keeps each row's type
    args: ['=VSTACK(SetVars("x", 1), SetVars("x", "one"), SetVars("x", TRUE))']
    expected:
      - [1]
      - ["one"]
      - [True]

  # #442: an error shows in place: as its text inside a list, as itself alone
  - name: a list holding an error shows each element, the error as its text
    args: ['=SetVars("p", "A1", "ns", IF({TRUE;FALSE;TRUE}, {"B1";"";"A2"}, #VALUE!))', "=TRUE"]
    expected: [["p", "ns"], ["A1", "[B1, #VALUE!, A2]"]]

  - name: a scalar error shows as the error
    args: ['=SetVars("a", 1, "e", 1/0)', "=TRUE"]
    expected: [["a", "e"], [1, -2146826281]]

  - name: SCAN rows with an error variable stay readable
    args: ['=SCAN(SetVars("e", 0), {1;2}, LAMBDA(a, v, SetVars("e", IF(v = 1, NA(), v))))', "=TRUE"]
    expected: [["e"], [-2146826246], [2]]

  - name: SCAN of Tim's neighbour list keeps the whole table (#442)
    args: ['=SCAN(SetVars("p", "A1"), {1;2}, LAMBDA(a, v, SetVars("p", "B" & v, "ns", IF({TRUE;FALSE}, {"B1";""}, #VALUE!))))', "=TRUE"]
    expected: [["p", "ns"], ["B1", "[B1, #VALUE!]"], ["B2", "[B1, #VALUE!]"]]

  - name: REDUCE state with an error array
    args: ['=REDUCE(SetVars("ns", {1;2}, "n", 0), {1;2;3}, LAMBDA(a, v, SetVars("ns", GetVar(a, "ns")/{1;0}, "n", GetVar(a, "n") + 1)))', "=TRUE"]
    expected: [["ns", "n"], ["[1, #DIV/0!]", 3]]

  # #463: SCAN over a row (TEXTSPLIT(x, ",")) gives a row of states; every step shows
  - name: a row of states shows one row per state
    args: ['=HSTACK(SetVars("a", 1, "b", 2), SetVars("a", 3, "b", 4))', "=TRUE"]
    expected:
      - ["a", "b"]
      - [1, 2]
      - [3, 4]

  - name: SCAN over a split row shows every step
    args: ['=SCAN(SetVars("n", 0, "last", "-"), TEXTSPLIT("x,y,z", ","), LAMBDA(a, v, SetVars("n", GetVar(a, "n") + 1, "last", v)))', "=TRUE"]
    expected:
      - ["n", "last"]
      - [1, "x"]
      - [2, "y"]
      - [3, "z"]

  - name: SCAN over a split column shows the same steps
    args: ['=SCAN(SetVars("n", 0, "last", "-"), TEXTSPLIT("x,y,z", , ","), LAMBDA(a, v, SetVars("n", GetVar(a, "n") + 1, "last", v)))', "=TRUE"]
    expected:
      - ["n", "last"]
      - [1, "x"]
      - [2, "y"]
      - [3, "z"]

  - name: a row of one-variable states without headers
    args: ['=SCAN(SetVars("s", 0), {1,2,3}, LAMBDA(a, v, SetVars("s", GetVar(a, "s") + v)))']
    expected:
      - [1]
      - [3]
      - [6]
