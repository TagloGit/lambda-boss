tests:
  - name: SetBreak on empty state produces meta block + empty user block
    args: ['=NewState()', "=TRUE"]
    expected: "BREAK\x1Eb\x1ETRUE\x1C"

  - name: SetBreak FALSE on empty state
    args: ['=NewState()', "=FALSE"]
    expected: "BREAK\x1Eb\x1EFALSE\x1C"

  - name: SetBreak preserves user variables
    args: ['=SetVars("x", 5, "y", 7)', "=TRUE"]
    expected: "BREAK\x1Eb\x1ETRUE\x1Cx\x1En\x1E5\x1Fy\x1En\x1E7"

  - name: SetBreak with existing meta replaces BREAK value
    args: ['=SetBreak(NewState(), FALSE)', "=TRUE"]
    expected: "BREAK\x1Eb\x1ETRUE\x1C"

  - name: SetBreak preserves existing meta INDEX field
    args: ['=SetIndex(NewState(), 3)', "=TRUE"]
    expected: "INDEX\x1En\x1E3\x1FBREAK\x1Eb\x1ETRUE\x1C"

  - name: help text
    args: []
    expected_type: array
