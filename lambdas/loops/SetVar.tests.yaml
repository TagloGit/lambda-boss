tests:
  - name: set scalar in empty state
    args: ['=NewState()', "x", "=5"]
    expected: "x\x1E5"

  - name: replace scalar with same name
    args: ['=SetVar(NewState(), "x", 5)', "x", "=7"]
    expected: "x\x1E7"

  - name: append second var
    args: ['=SetVar(NewState(), "x", 5)', "y", "=7"]
    expected: "x\x1E5\x1Fy\x1E7"

  - name: array value uses gs separator
    args: ['=NewState()', "arr", '={1;2;3}']
    expected: "arr\x1E1\x1D2\x1D3"

  - name: help text
    args: []
    expected_type: array
