tests:
  - name: one pair
    args: ["x", "=5"]
    expected: "x\x1Es5"

  - name: three pairs
    args: ["cur", "=1", "best", "=2", "ends", "=3"]
    expected: "cur\x1Es1\x1Fbest\x1Es2\x1Fends\x1Es3"

  - name: five pairs
    args: ["a", "=1", "b", "=2", "c", "=3", "d", "=4", "e", "=5"]
    expected: "a\x1Es1\x1Fb\x1Es2\x1Fc\x1Es3\x1Fd\x1Es4\x1Fe\x1Es5"

  - name: array value preserved with type tag
    args: ["arr", "={10;20;30}"]
    expected: "arr\x1Ea10\x1D20\x1D30"

  - name: help text
    args: []
    expected_type: array
