tests:
  - name: one numeric pair
    args: ["x", "=5"]
    expected: "x\x1En\x1E5"

  - name: three numeric pairs
    args: ["cur", "=1", "best", "=2", "ends", "=3"]
    expected: "cur\x1En\x1E1\x1Fbest\x1En\x1E2\x1Fends\x1En\x1E3"

  - name: five numeric pairs
    args: ["a", "=1", "b", "=2", "c", "=3", "d", "=4", "e", "=5"]
    expected: "a\x1En\x1E1\x1Fb\x1En\x1E2\x1Fc\x1En\x1E3\x1Fd\x1En\x1E4\x1Fe\x1En\x1E5"

  - name: ten numeric pairs
    args: ["a", "=1", "b", "=2", "c", "=3", "d", "=4", "e", "=5", "f", "=6", "g", "=7", "h", "=8", "i", "=9", "j", "=10"]
    expected: "a\x1En\x1E1\x1Fb\x1En\x1E2\x1Fc\x1En\x1E3\x1Fd\x1En\x1E4\x1Fe\x1En\x1E5\x1Ff\x1En\x1E6\x1Fg\x1En\x1E7\x1Fh\x1En\x1E8\x1Fi\x1En\x1E9\x1Fj\x1En\x1E10"

  - name: numeric array uses gs separator
    args: ["arr", "={10;20;30}"]
    expected: "arr\x1En\x1E10\x1D20\x1D30"

  # #376 repro: a 1x1 array value mid-chain used to drop every later entry
  - name: 1x1 array value does not drop later pairs
    args: ["grid", '={"W";"W"}', "pos", '={"AY50"}', "dir", "E"]
    expected: "grid\x1Et\x1EW\x1DW\x1Fpos\x1Et\x1EAY50\x1Fdir\x1Et\x1EE"

  - name: MOVECELL output (1x1 array) does not drop later pairs
    args: ["grid", '={"W";"W"}', "pos", '=MOVECELL("AX50","E")', "dir", "E"]
    expected: "grid\x1Et\x1EW\x1DW\x1Fpos\x1Et\x1EAY50\x1Fdir\x1Et\x1EE"

  # Unique keys: a repeated name replaces the earlier pair and moves to its later position
  - name: repeated name keeps one entry
    args: ["x", "=1", "x", "=2"]
    expected: "x\x1En\x1E2"

  - name: repeated name moves to the later position
    args: ["x", "=1", "y", "=2", "x", "=3"]
    expected: "y\x1En\x1E2\x1Fx\x1En\x1E3"

  - name: repeat is case-insensitive and keeps the later spelling
    args: ["x", "=1", "X", "=2"]
    expected: "X\x1En\x1E2"

  - name: repeat across the last slot
    args: ["a", "=1", "b", "=2", "c", "=3", "d", "=4", "e", "=5", "f", "=6", "g", "=7", "h", "=8", "i", "=9", "a", "=10"]
    expected: "b\x1En\x1E2\x1Fc\x1En\x1E3\x1Fd\x1En\x1E4\x1Fe\x1En\x1E5\x1Ff\x1En\x1E6\x1Fg\x1En\x1E7\x1Fh\x1En\x1E8\x1Fi\x1En\x1E9\x1Fa\x1En\x1E10"

  - name: a number and its text are the same name
    args: ["=1", "=5", "1", "=6"]
    expected: "1\x1En\x1E6"

  - name: omitted middle pair is skipped
    args: ["a", "=1", "=", "=", "b", "=2"]
    expected: "a\x1En\x1E1\x1Fb\x1En\x1E2"

  - name: tags for text and boolean values
    args: ["t", "hi", "f", "=FALSE"]
    expected: "t\x1Et\x1Ehi\x1Ff\x1Eb\x1EFALSE"

  # #442: an error is tagged e; each element carries its type, an error is CHAR(28) and its ERROR.TYPE
  - name: an error in an array is encoded in place
    args: ["a", "=1", "ns", "={1;2}/{1;0}"]
    expected: "a\x1En\x1E1\x1Fns\x1Ee\x1En1\x1D\x1C2"

  - name: a scalar error is encoded
    args: ["e", "=NA()"]
    expected: "e\x1Ee\x1E\x1C7"
