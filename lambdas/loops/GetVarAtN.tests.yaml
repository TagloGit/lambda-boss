tests:
  - name: read slot 2 as number
    args: ['=SetState(10, 20, 30)', "=2"]
    expected: 20

  - name: array slot as numeric vertical array
    args: ['=SetState(1, {10;20;30})', "=2"]
    expected: [[10], [20], [30]]

  - name: missing slot returns NA
    args: ['=SetState(10, 20, 30)', "=4"]
    expected: -2146826246

  - name: help text
    args: []
    expected_type: array
