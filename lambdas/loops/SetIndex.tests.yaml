tests:
  - name: SetIndex on empty state produces meta block
    args: ['=NewState()', "=3"]
    expected: "INDEX\x1En\x1E3\x1C"

  - name: SetIndex preserves user variables
    args: ['=SetVars("x", 5, "y", 7)', "=2"]
    expected: "INDEX\x1En\x1E2\x1Cx\x1En\x1E5\x1Fy\x1En\x1E7"

  - name: SetIndex with existing meta replaces INDEX value
    args: ['=SetIndex(NewState(), 1)', "=5"]
    expected: "INDEX\x1En\x1E5\x1C"

  - name: SetIndex preserves existing BREAK field
    args: ['=SetBreak(NewState(), TRUE)', "=3"]
    expected: "BREAK\x1Eb\x1ETRUE\x1FINDEX\x1En\x1E3\x1C"

  - name: SetIndex 0 produces meta entry
    args: ['=NewState()', "=0"]
    expected: "INDEX\x1En\x1E0\x1C"

  - name: help text
    args: []
    expected_type: array
