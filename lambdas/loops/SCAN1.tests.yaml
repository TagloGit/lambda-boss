tests:
  - name: running maximum, first element unchanged
    args: ['={3;7;2;9}', '=MAX']
    expected: [[3], [7], [7], [9]]

  - name: running sum via LAMBDA reducer
    args: ['={1;2;3;4}', '=LAMBDA(a, b, a + b)']
    expected: [[1], [3], [6], [10]]

  - name: horizontal input keeps horizontal orientation
    args: ['={3,7,2,9}', '=MAX']
    expected: [[3, 7, 7, 9]]

  - name: single-element input returns that element
    args: ['={5}', '=MAX']
    expected: 5

  - name: fn closure over a cell reference (eta-wrap regression, #343)
    setup:
      cells:
        - address: "C3"
          values: 10
    args: ["={1;2;3}", "=LAMBDA(a_, v_, a_ + v_*C3)"]
    expected: [[1], [21], [51]]

  - name: help text
    args: []
    expected_type: array
