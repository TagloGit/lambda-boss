tests:
  - name: empty state has no meta block, returns 0
    args: ['=NewState()']
    expected: 0

  - name: state without meta block returns 0
    args: ['=SetVars("x", 5)']
    expected: 0

  - name: state with INDEX=5 returns 5
    args: ['=SetIndex(NewState(), 5)']
    expected: 5

  - name: state with INDEX=0 returns 0
    args: ['=SetIndex(NewState(), 0)']
    expected: 0

  - name: INDEX survives user SetVar
    args: ['=SetVar(SetIndex(NewState(), 7), "x", 5)']
    expected: 7

  - name: BREAK and INDEX both present, GetIndex returns INDEX
    args: ['=SetIndex(SetBreak(NewState(), TRUE), 4)']
    expected: 4

  - name: help text
    args: []
    expected_type: array
