tests:
  - name: exclusive prefix sum - total before each element
    args: ['=0', '={10;20;30}', '=LAMBDA(a, v, a + v)']
    expected: [[0], [10], [30]]

  - name: out[1] is the seed, not fn(seed, x1)
    args: ['=5', '={1;1;1}', '=LAMBDA(a, v, a + v)']
    expected: [[5], [6], [7]]

  - name: horizontal input keeps horizontal orientation
    args: ['=0', '={10,20,30}', '=LAMBDA(a, v, a + v)']
    expected: [[0, 10, 30]]

  - name: single-element input returns just the seed
    args: ['=7', '={4}', '=LAMBDA(a, v, a + v)']
    expected: 7

  - name: help text
    args: []
    expected_type: array
