tests:
  - name: scalar coerces to number
    args: ['=SetVar(NewState(), "x", 5)', "x"]
    expected: 5

  - name: array coerces to vertical numeric array
    args: ['=SetVar(NewState(), "arr", {10;20;30})', "arr"]
    expected: [[10], [20], [30]]

  - name: missing var returns NA
    args: ['=SetVar(NewState(), "x", 5)', "missing"]
    expected: -2146826246

  - name: help text
    args: []
    expected_type: array
