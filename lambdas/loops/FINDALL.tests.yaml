tests:
  - name: all matches returned in case order
    args: ['={"a";"b";"c"}', '=LAMBDA(cur, i, IF(cur<>"b", cur & i, ""))']
    expected: [["a1"], ["c3"]]

  - name: every case matches
    args: ['={1;2;3}', '=LAMBDA(cur, i, cur*10)']
    expected: [[10], [20], [30]]

  - name: no matches returns default sentinel
    args: ['={"a";"b";"c"}', '=LAMBDA(cur, i, "")']
    expected: ""

  - name: no matches with custom if_not_found
    args: ['={"a";"b";"c"}', '=LAMBDA(cur, i, "")', "no hits"]
    expected: "no hits"

  - name: custom sentinel NULL preserves empty-string answers
    args: ['={"x";"y";"z"}', '=LAMBDA(cur, i, IF(cur="y", "", "NULL"))', "NULL", "NULL"]
    expected: ""

  - name: custom sentinel + custom if_not_found differ
    args: ['={"x";"y";"z"}', '=LAMBDA(cur, i, "NULL")', "none", "NULL"]
    expected: "none"

  - name: horizontal cases work the same as vertical
    args: ['={"a","b","c"}', '=LAMBDA(cur, i, IF(cur<>"b", cur & i, ""))']
    expected: [["a1"], ["c3"]]

  - name: single match returns single-row array (collapses to scalar)
    args: ['={"a";"b";"c"}', '=LAMBDA(cur, i, IF(cur="b", "got-" & i, ""))']
    expected: "got-2"

  - name: numeric matches round-trip
    args: ['={1;2;3;4;5}', '=LAMBDA(cur, i, IF(MOD(cur, 2)=0, cur, ""))']
    expected: [[2], [4]]

  - name: error in predicate is treated as a miss - good results still returned
    args: ['={1;2;3}', '=LAMBDA(cur, i, IF(cur=2, 1/0, cur*10))']
    expected: [[10], [30]]

  - name: all predicate errors return if_not_found
    args: ['={1;2;3}', '=LAMBDA(cur, i, 1/0)', "all errored"]
    expected: "all errored"

  - name: help text
    args: []
    expected_type: array
