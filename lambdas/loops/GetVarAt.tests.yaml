tests:
  - name: read slot 1
    args: ['=SetState(10, 20, 30)', "=1"]
    expected: "10"

  - name: read slot 2
    args: ['=SetState(10, 20, 30)', "=2"]
    expected: "20"

  - name: read slot 3
    args: ['=SetState(10, 20, 30)', "=3"]
    expected: "30"

  - name: missing slot returns NA
    args: ['=SetState(10, 20, 30)', "=4"]
    expected: -2146826246

  - name: index collision - slot 1 vs slot 10
    args: ['=SetVars("1", "first", "10", "tenth")', "=1"]
    expected: "first"

  - name: array slot returns vertical array of text
    args: ['=SetState(1, {10;20;30})', "=2"]
    expected: [["10"], ["20"], ["30"]]

  - name: help text
    args: []
    expected_type: array
