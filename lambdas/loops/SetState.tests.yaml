tests:
  - name: single value at slot 1
    args: ["=42"]
    expected: "1\x1E42"

  - name: three values
    args: ["=10", "=20", "=30"]
    expected: "1\x1E10\x1F2\x1E20\x1F3\x1E30"

  - name: five values
    args: ["=1", "=2", "=3", "=4", "=5"]
    expected: "1\x1E1\x1F2\x1E2\x1F3\x1E3\x1F4\x1E4\x1F5\x1E5"

  - name: array value at slot 3
    args: ["=1", "=2", "={10;20;30}"]
    expected: "1\x1E1\x1F2\x1E2\x1F3\x1E10\x1D20\x1D30"

  - name: help text
    args: []
    expected_type: array
