tests:
  - name: face one
    args: ["⚀"]
    expected: 1

  - name: face three
    args: ["⚂"]
    expected: 3

  - name: face six
    args: ["⚅"]
    expected: 6

  - name: non-die letter returns #N/A
    args: ["Z"]
    expected: -2146826246

  - name: error input is caught and returns #N/A
    args: ["=1/0"]
    expected: -2146826246

  - name: horizontal array of dice lifts
    args: ['={"⚀","⚂","⚅"}']
    expected: [[1, 3, 6]]

  - name: vertical array of dice lifts
    args: ['={"⚀";"⚂";"⚅"}']
    expected: [[1], [3], [6]]

  - name: mixed array guards per element
    args: ['={"⚀","X","⚅"}']
    expected: [[1, -2146826246, 6]]

  - name: help text
    args: []
    expected_type: array
