tests:
  - name: mixed runs
    args: ["AABBBCA"]
    expected: [["AA"], ["BBB"], ["C"], ["A"]]

  - name: single character
    args: ["X"]
    expected: "X"

  - name: no consecutive repeats
    args: ["ABCD"]
    expected: [["A"], ["B"], ["C"], ["D"]]

  - name: all same character
    args: ["ZZZZZ"]
    expected: "ZZZZZ"

  - name: arrows longest streak scenario
    args: ["↑↑↓↓↓→"]
    expected: [["↑↑"], ["↓↓↓"], ["→"]]

  - name: mixed case splits runs by default
    args: ["AaaB"]
    expected: [["A"], ["aa"], ["B"]]

  - name: case_insensitive 1 groups runs across case
    args: ["AaaB", "=1"]
    expected: [["Aaa"], ["B"]]

  - name: case_insensitive 1 preserves original casing in output
    args: ["aAbBbA", "=1"]
    expected: [["aA"], ["bBb"], ["A"]]

  - name: repeated grapheme cluster is one run
    args: ["\U0001F44D\U0001F3FD\U0001F44D\U0001F3FDaa"]
    expected: [["\U0001F44D\U0001F3FD\U0001F44D\U0001F3FD"], ["aa"]]

  - name: help text
    args: []
    expected_type: array
