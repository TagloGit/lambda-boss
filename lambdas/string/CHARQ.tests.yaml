tests:
  - name: single character match
    args: ["MASSAGE", "S"]
    expected: 2

  - name: no matches found
    args: ["HELLO", "Z"]
    expected: 0

  - name: multi-character substring
    args: ["abcabcabc", "abc"]
    expected: 3

  - name: entire string is the search term
    args: ["AAA", "AAA"]
    expected: 1

  - name: single character string
    args: ["X", "X"]
    expected: 1

  - name: regex mode basic match
    args: ["abc123def456", "[0-9]+", true]
    expected: 2

  - name: regex mode no matches
    args: ["abcdef", "[0-9]+", true]
    expected: 0

  - name: regex mode single char pattern
    args: ["MASSAGE", "S", true]
    expected: 2

  - name: case-sensitive by default in literal mode
    args: ["MASSAGE", "s"]
    expected: 0

  - name: explicit case_insensitive 0 is case-sensitive
    args: ["MASSAGE", "S", "=", "=0"]
    expected: 2

  - name: case_insensitive 1 counts across case in literal mode
    args: ["MASSAGE", "s", "=", "=1"]
    expected: 2

  - name: case_insensitive 1 with multi-character substring
    args: ["abcABCAbc", "ABC", "=", "=1"]
    expected: 3

  - name: case-sensitive by default in regex mode
    args: ["MASSAGE", "m", "=TRUE"]
    expected: 0

  - name: case_insensitive 1 in regex mode
    args: ["MASSAGE", "m", "=TRUE", "=1"]
    expected: 1

  - name: vertical array of texts lifts (literal mode)
    args: ['={"MASSAGE";"HELLO";"abcabc"}', "S"]
    expected: [[2], [0], [0]]

  - name: vertical array of texts lifts (regex mode)
    args: ['={"abc123def456";"abcdef";"1a2b3c"}', "[0-9]+", true]
    expected: [[2], [0], [3]]

  - name: 1x1 array input in literal mode (#318)
    args: ['=CHOOSEROWS({"MASSAGE";"x"},1)', "S"]
    expected: 2

  - name: 1x1 array input in regex mode counts all matches (#318)
    args: ['=CHOOSEROWS({"abc123def456";"x"},1)', "[0-9]+", true]
    expected: 2

  - name: help text
    args: []
    expected_type: array
