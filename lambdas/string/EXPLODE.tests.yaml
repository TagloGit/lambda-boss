tests:
  - name: single characters (default chunk_size)
    args: ["abcdef"]
    expected: [["a"], ["b"], ["c"], ["d"], ["e"], ["f"]]

  - name: chunk size of 3
    args: ["abcdefgh", 3]
    expected: [["abc"], ["def"], ["gh"]]

  - name: chunk size of 2 horizontal
    args: ["abcdefgh", 2, true]
    expected: [["ab", "cd", "ef", "gh"]]

  - name: chunk size evenly divisible
    args: ["abcdef", 2]
    expected: [["ab"], ["cd"], ["ef"]]

  - name: chunk size larger than string
    args: ["hi", 10]
    expected: "hi"

  - name: single character string
    args: ["x"]
    expected: "x"

  - name: sliding windows of 3
    args: ["abcdef", "=3", "=", "=TRUE"]
    expected: [["abc"], ["bcd"], ["cde"], ["def"]]

  - name: sliding windows of 2 horizontal
    args: ["abcde", "=2", "=TRUE", "=TRUE"]
    expected: [["ab", "bc", "cd", "de"]]

  - name: sliding with text shorter than chunk returns whole string
    args: ["hi", "=5", "=", "=TRUE"]
    expected: "hi"

  - name: sliding with chunk size 1 matches default explode
    args: ["abc", "=1", "=", "=TRUE"]
    expected: [["a"], ["b"], ["c"]]

  - name: sliding window equal to text length returns whole string
    args: ["abcd", "=4", "=", "=TRUE"]
    expected: "abcd"

  - name: multi-codepoint emoji counts as one character
    args: ["\U0001F44D\U0001F3FDab"]
    expected: [["\U0001F44D\U0001F3FD"], ["a"], ["b"]]

  - name: chunks never split a grapheme cluster
    args: ["\U0001F44D\U0001F3FDab", 2]
    expected: [["\U0001F44D\U0001F3FDa"], ["b"]]

  - name: single cluster string returns whole cluster
    args: ["\U0001F44D\U0001F3FD"]
    expected: "\U0001F44D\U0001F3FD"

  - name: sliding windows respect clusters
    args: ["\U0001F44D\U0001F3FDab", "=2", "=", "=TRUE"]
    expected: [["\U0001F44D\U0001F3FDa"], ["ab"]]

  - name: non-BMP single-codepoint emoji still one character
    args: ["a\U0001F600b"]
    expected: [["a"], ["\U0001F600"], ["b"]]

  - name: help text
    args: []
    expected_type: array
