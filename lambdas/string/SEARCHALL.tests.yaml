tests:
  - name: all positions of a single character
    args: ["KTTKBPK", "K"]
    expected: [[1], [4], [7]]

  - name: overlapping matches (default)
    args: ["aaaa", "aa"]
    expected: [[1], [2], [3]]

  - name: non-overlapping matches consume the substring
    args: ["aaaa", "aa", "=", "=FALSE"]
    expected: [[1], [3]]

  - name: case-sensitive by default finds only exact case
    args: ["abcABC", "abc"]
    expected: 1

  - name: explicit case_insensitive 0 is case-sensitive
    args: ["abcABC", "abc", "=0"]
    expected: 1

  - name: case_insensitive 1 finds both cases
    args: ["abcABC", "abc", "=1"]
    expected: [[1], [4]]

  - name: case-sensitive multi-match by default
    args: ["aAaA", "A"]
    expected: [[2], [4]]

  - name: no match returns error by default
    args: ["HELLO", "Z"]
    expected: -2146826246

  - name: no match returns if_not_found sentinel
    args: ["HELLO", "Z", "=", "=", "none"]
    expected: "none"

  - name: searchFor longer than inText yields no match
    args: ["ab", "abc"]
    expected: -2146826246

  - name: empty searchFor is guarded and returns sentinel
    args: ["abc", "", "=", "=", "empty"]
    expected: "empty"

  - name: default positions are code points around clusters
    args: ["\U0001F44D\U0001F3FDx\U0001F44D\U0001F3FDx", "x"]
    expected: [[3], [6]]

  - name: position_unit 1 returns grapheme positions
    args: ["\U0001F44D\U0001F3FDx\U0001F44D\U0001F3FDx", "x", "=", "=", "=", "=1"]
    expected: [[2], [4]]

  - name: position_unit 1 on plain text matches default
    args: ["KTTKBPK", "K", "=", "=", "=", "=1"]
    expected: [[1], [4], [7]]

  - name: position_unit 1 no match returns sentinel
    args: ["HELLO", "Z", "=", "=", "none", "=1"]
    expected: "none"

  - name: help text
    args: []
    expected_type: array
